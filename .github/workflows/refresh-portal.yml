# Manual fire-button for the exam-week article job on shishya.in:
#   - /api/cron/refresh-phase-articles  (Reddit + RSS → Claude →
#                                        per-exam phase articles)
#
# No schedule (2 Oct 2026). This workflow used to fire every 8 hours
# because Vercel's Hobby tier allowed one run a day per cron. vercel.json
# now runs the same job itself (07:00, 12:00 and 21:00 IST), so the
# schedule here was a second scheduler for one job: it fired 2.5 to 8
# hours late and made 32 of the job's 44 web calls in ten days ($7.7 of
# $10.63), paid from a credit balance that is topped up by hand. The
# 21:00 IST slot in vercel.json replaces the one thing the late run did
# that Vercel did not: write the evening REACTIONS pages (an exam day
# turns "evening" at 18:00 IST).
#
# The seed-discussions step is gone too (2 Oct 2026): 8 threads, 0
# replies, 12 page views in ten days. Its Vercel cron entry was removed
# in the same change.
#
# Authentication: the call sends `Authorization: Bearer ${CRON_SECRET}`
# matching the same secret Vercel uses. Stored as a repository secret
# in GitHub Settings → Secrets and variables → Actions.
#
# Check: tests/unit/spend-schedules.test.ts

name: Refresh exam-week pages (manual)

on:
  # Manual fire-button on the Actions tab for ad-hoc refreshes. There is
  # no `schedule:` on purpose; see the header before adding one back.
  workflow_dispatch:

# Don't let two manual runs pile up if a previous one is still
# in flight — the cron endpoint is idempotent so cancelling the
# older one is safe.
concurrency:
  group: refresh-portal
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh phase articles (Reddit/RSS → Claude → articles)
        run: |
          echo "Calling refresh-phase-articles at $(date -u)…"
          curl --max-time 300 --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://shishya.in/api/cron/refresh-phase-articles" \
            | head -c 4000
          echo ""
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
